version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./app/uploads:/app/app/uploads
      - ./app/app.db:/app/app/app.db
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - SECRET_KEY=docker-secret-key-change-in-production
    restart: unless-stopped

  # Optional PostgreSQL database for production
  # Uncomment if you want to use PostgreSQL instead of SQLite
